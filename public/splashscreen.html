<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>el.esy.CAD Community wird gestartet …</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        color: #1f1330;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1526;
          color: #f2edfb;
        }
      }

      .karte {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        -webkit-app-region: drag;
      }

      .logo {
        width: 76px;
        height: auto;
        filter: drop-shadow(0 2px 10px rgba(126, 20, 255, 0.25));
      }

      .titel {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(126, 20, 255, 0.18);
        border-top-color: #7e14ff;
        animation: drehen 0.8s linear infinite;
      }

      @media (prefers-color-scheme: dark) {
        .spinner {
          border-color: rgba(151, 92, 255, 0.28);
          border-top-color: #a06bff;
        }
      }

      @keyframes drehen {
        to {
          transform: rotate(360deg);
        }
      }

      .status {
        margin: 0;
        font-size: 13px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="karte" data-tauri-drag-region>
      <img class="logo" src="/favicon.svg" alt="" />
      <p class="titel">el.esy.CAD Community</p>
      <div class="spinner" role="status" aria-label="Wird geladen"></div>
      <p class="status">Wird gestartet …</p>
    </div>
  </body>
</html>
