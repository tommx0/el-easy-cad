name: Windows-App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, an das der Installer angehaengt wird
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: pnpm einrichten
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust-Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Sidecar vorbereiten
        run: node skripte/tauri-sidecar-vorbereiten.mjs

      - name: Windows-App bauen
        run: node skripte/tauri-bauen.mjs build --target x86_64-pc-windows-msvc

      - name: Installer an das Release haengen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe --clobber
